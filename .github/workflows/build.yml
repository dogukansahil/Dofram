name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: cmd
        run: build.bat test
      - uses: actions/upload-artifact@v4
        with:
          name: Dofram-windows-x64
          path: build/Dofram.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksum
        run: cd dist && sha256sum Dofram.exe > Dofram.exe.sha256
      - name: Write the release notes from CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]*\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $ver" >&2
            exit 1
          fi
          sum="$(cut -d ' ' -f 1 dist/Dofram.exe.sha256)"
          cat >> notes.md <<EOF

          ## Download and install

          Download \`Dofram.exe\` below and run it. Dofram asks what to do:

          - **Install Dofram** copies it to Program Files, adds a Start menu shortcut and an entry in *Installed apps*.
          - **Run without installing** keeps it portable: it runs from any folder or a USB stick. Put an empty \`dofram.ini\` next to the file to keep the settings there too.

          ## How to update

          Run the new \`Dofram.exe\`. If Dofram is installed, choose *Update the installed copy*: it replaces the version in Program Files and keeps your settings. A portable copy is updated by replacing the file.

          *Check for Updates on GitHub* in the tray menu tells you when a newer version is out.

          ## Checksum

          SHA-256 of \`Dofram.exe\`: \`$sum\` (also in \`Dofram.exe.sha256\`). Windows may say "unknown publisher" because the file is not code-signed; compare the checksum, then choose *More info > Run anyway*.

          Full history: [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md).
          EOF
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/Dofram.exe dist/Dofram.exe.sha256
          --repo "$GITHUB_REPOSITORY" --title "Dofram $GITHUB_REF_NAME" --notes-file notes.md --latest
