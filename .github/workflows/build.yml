name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: cmd
        run: build.bat test
      - uses: actions/upload-artifact@v4
        with:
          name: Dofram-windows-x64
          path: build/Dofram.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksum
        run: cd dist && sha256sum Dofram.exe > Dofram.exe.sha256
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/Dofram.exe dist/Dofram.exe.sha256
          --repo "$GITHUB_REPOSITORY" --title "Dofram $GITHUB_REF_NAME" --generate-notes
